#
# What xstate's reference adds to tools/doc/mrdocs.yml.in, the settings every
# library's reference shares: only keys of how the reference is presented.

# Each enumerator has a section of its own, with its value and its whole Doc
# Comment: the enum's table of members would show each enumerator's brief
# alone, and the details of errc's enumerators say when each error is
# reported.
show-enum-constants: true

# A class lists only its own members. The two actor logics derive from
# xactor's actor_logic, whose members MrDocs would otherwise copy into each,
# its pure handle beside the logic's own and its deleted assignments, with
# xactor's Doc Comments read in xstate's namespace, where a reference to
# xactor's status::error names xstate's status::error and one to
# scheduler::error_of names nothing. xactor's reference documents them.
inherit-base-members: never
